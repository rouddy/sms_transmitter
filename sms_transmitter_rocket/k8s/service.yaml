apiVersion: v1
kind: Service
metadata:
  name: sms-transmitter
  namespace: sms-transmitter
  labels:
    app: sms-transmitter
spec:
  # ClusterIP 타입은 클러스터 내부에서만 접근 가능하다(외부 노출 없음).
  # type을 생략해도 기본값이 ClusterIP다. LoadBalancer/NodePort/Ingress를
  # 만들지 않아 외부 접근은 차단된다.
  type: ClusterIP
  selector:
    app: sms-transmitter
  ports:
    - name: http
      port: 54323
      targetPort: http
      protocol: TCP