apiVersion: v1
kind: Service
metadata:
  name: sms-transmitter
  namespace: sms-transmitter
  labels:
    app: sms-transmitter
spec:
  # 노드(192.168.1.11)와 외부에서 54323으로 접근해야 하므로 NodePort를 쓴다.
  # k3s의 service-node-port-range가 확장돼 있어(geme-stage가 54321 사용)
  # 기본 범위(30000-32767) 밖인 54323도 지정할 수 있다.
  type: NodePort
  selector:
    app: sms-transmitter
  ports:
    - name: http
      port: 54323
      targetPort: http
      nodePort: 54323
      protocol: TCP