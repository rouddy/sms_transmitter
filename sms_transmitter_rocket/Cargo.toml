[package]
name = "sms_transmitter_rocket"
version = "0.3.2"
edition = "2021"

[dependencies]
rocket = { version = "0.5", features = ["json"] }
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-rocket = "7"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1"
rocket_dyn_templates = { version = "0.2", features = ["tera"] }
rand = "0.8"
